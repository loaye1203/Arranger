[workspace]
members = ["crates/arranger-core", "crates/arranger"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
kurbo = "=0.13.1"
linesweeper = "=0.5.0"
resvg = "=0.48.1"
harfrust = "=0.12.0"
roxmltree = "=0.21.1"
unicode-segmentation = "=1.13.3"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
zune-jpeg = "=0.5.15"
flate2 = "=1.1.10"
skia-safe = { version = "=0.153.3", features = ["textlayout"] }

[profile.release]
debug = false
