[package]
name = "arranger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:block2"]
test-hooks = ["desktop", "arranger-core/test-hooks"]

[dependencies]
arranger-core = { path = "../arranger-core" }
serde.workspace = true
serde_json.workspace = true
kurbo.workspace = true
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }

[[bin]]
name = "arranger"
path = "src/main.rs"

# Reuse the exact AppKit bindings already pinned and cached for winit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.5", optional = true }
block2 = { version = "=0.6.2", optional = true }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSArray", "NSURL", "NSNotification"], optional = true }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSEvent", "NSResponder", "NSWindow", "NSPanel", "NSSavePanel", "NSOpenPanel", "NSGraphicsContext", "block2"], optional = true }
